[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notella"
version = "0.1.0"
description = "Ontology-guided semantic LoRA training by Project Revive Solutions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
notella = "notella.__main__:main"

[tool.setuptools.packages.find]
include = ["notella*"]
