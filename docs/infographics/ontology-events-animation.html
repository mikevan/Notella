function tick(now){if(playing&&!recording){position=Math.min(duration,(now-anchor)/1000);draw(position);if(position>=duration){playing=false;document.getElementById('play').textContent='Play animation'}}requestAnimationFrame(tick)}requestAnimationFrame(tick);draw(0);document.getElementById('play').onclick=()=>{if(recording)return;if(playing){playing=false;document.getElementById('play').textContent='Play animation'}else{if(position>=duration)position=0;anchor=performance.now()-position*1000;playing=true;document.getElementById('play').textContent='Pause'}};document.getElementById('restart').onclick=()=>{position=0;anchor=performance.now();draw(0)};document.getElementById('seek').oninput=e=>{playing=false;position=Number(e.target.value);draw(position);document.getElementById('play').textContent='Play animation'};

window.recordOntology=async({seconds=58}={})=>{if(recording)throw Error('Already recording');recording=true;playing=false;draw(0);const type=['video/mp4;codecs=avc1.42001E','video/mp4','video/webm;codecs=vp9'].find(t=>MediaRecorder.isTypeSupported(t));if(!type)throw Error('No supported video encoder');const stream=canvas.captureStream(24),chunks=[];const recorder=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:4000000});const stopped=new Promise((resolve,reject)=>{recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=resolve;recorder.onerror=e=>reject(Error(e.error?.message||'Recording failed'))});recorder.start(500);const start=performance.now();await new Promise(resolve=>{function frame(now){const elapsed=(now-start)/1000;draw(Math.min(duration,elapsed*duration/seconds));if(elapsed<seconds)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});recorder.stop();await stopped;stream.getTracks().forEach(t=>t.stop());recording=false;const blob=new Blob(chunks,{type:recorder.mimeType});const metadata=await new Promise((resolve,reject)=>{const video=document.createElement('video'),url=URL.createObjectURL(blob);video.onloadedmetadata=()=>{resolve({width:video.videoWidth,height:video.videoHeight,duration:Number.isFinite(video.duration)?video.duration:seconds});URL.revokeObjectURL(url)};video.onerror=()=>reject(Error('Encoded video cannot be read'));video.src=url});const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(blob)});return {base64,mimeType:recorder.mimeType,bytes:blob.size,fps:24,requestedSeconds:seconds,...metadata}};
